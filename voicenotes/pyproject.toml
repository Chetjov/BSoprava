[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicenotes"
version = "0.1.0"
description = "Hlasové poznámky z iPhonu → Obsidian vault, lokálně"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# Na Pi stačí tohle.
gateway = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
# Na notebooku. CUDA runtime se instaluje mimo pip, viz README.
# Ollama backend nepotřebuje nic navíc — mluví se s ní přes stdlib.
worker = ["faster-whisper>=1.0"]
# Jen pro strukturování přes Claude API.
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "httpx>=0.27", "fastapi>=0.110", "python-multipart>=0.0.9"]

[project.scripts]
voicenotes-gateway = "voicenotes.gateway:main"
voicenotes-worker = "voicenotes.worker.run:main"
voicenotes-redo = "voicenotes.redo:main"
voicenotes-review = "voicenotes.review:main"
voicenotes-bench = "voicenotes.bench:main"

[tool.setuptools.packages.find]
include = ["voicenotes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
